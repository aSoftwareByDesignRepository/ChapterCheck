# Flatpak manifest — ChapterCheck (draft for Flathub)
#
# App ID: de.softwarebydesign.ChapterCheck
# Build locally once you have a release binary:
#   flatpak-builder --user --install --force-clean /tmp/cc-flatpak-build \
#     docs/store/flathub/de.softwarebydesign.ChapterCheck.yml
#
# Flathub submission: host the .deb (or a tarball of /usr) on GitHub Releases,
# then replace the "chaptercheck-bin" source url/sha256 below.
#
# Runtime ships mpv via the freedesktop SDK extension where possible; otherwise
# depend on the org.freedesktop.Platform.ffmpeg-full extension.

app-id: de.softwarebydesign.ChapterCheck
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: audioplayer
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-documents:ro
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.mpris.MediaPlayer2.chaptercheck
  # Host mpv is expected on PATH for this draft; Flathub PR should add an mpv module
  # or document a runtime extension. Local .deb users already depend on distro mpv.
modules:
  - name: chaptercheck-bin
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/audioplayer /app/bin/audioplayer
      - install -Dm644 share/applications/de.softwarebydesign.ChapterCheck.desktop /app/share/applications/de.softwarebydesign.ChapterCheck.desktop
      - install -Dm644 share/metainfo/de.softwarebydesign.ChapterCheck.metainfo.xml /app/share/metainfo/de.softwarebydesign.ChapterCheck.metainfo.xml
      - install -Dm644 share/icons/hicolor/512x512/apps/de.softwarebydesign.ChapterCheck.png /app/share/icons/hicolor/512x512/apps/de.softwarebydesign.ChapterCheck.png
      - install -Dm644 share/icons/hicolor/256x256/apps/de.softwarebydesign.ChapterCheck.png /app/share/icons/hicolor/256x256/apps/de.softwarebydesign.ChapterCheck.png
      - install -Dm644 share/icons/hicolor/128x128/apps/de.softwarebydesign.ChapterCheck.png /app/share/icons/hicolor/128x128/apps/de.softwarebydesign.ChapterCheck.png
    sources:
      - type: dir
        path: staged-prefix
