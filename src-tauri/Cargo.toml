[package]
name = "audioplayer"
version = "0.1.0"
description = "Audiobook-focused audio player for Linux"
authors = ["Alexander Mäule <info@software-by-design.de>"]
license = "MIT"
repository = "https://github.com/aSoftwareByDesignRepository/ChapterCheck"
edition = "2021"
rust-version = "1.77"

[lib]
name = "audioplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
natord = "1.0"
directories = "5"
rand = "0.8"

# OS media-key / headphone (MPRIS on Linux via D-Bus) integration.
# Default backend is `dbus-crossroads`, which uses the native libdbus that is
# already linked transitively through `tao`, so no extra system dependency.
[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = "0.8"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
