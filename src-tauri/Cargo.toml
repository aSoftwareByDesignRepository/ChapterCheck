[package]
name = "audioplayer"
version = "0.1.0"
description = "Audiobook-focused audio player for Linux"
authors = ["you"]
license = "MIT OR Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "audioplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
natord = "1.0"
directories = "5"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
